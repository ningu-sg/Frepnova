<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your LearnVerse account and continue learning.">
  <title>Login — LearnVerse</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><span>🎓</span> LearnVerse</a>
      <div class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="courses.html" class="nav-link">Courses</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle-btn" onclick="Theme.toggle()" aria-label="Toggle dark mode">🌙</button>
        <div id="nav-auth-btns"></div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Login to continue your learning journey</p>

      <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-input" type="email" id="login-email" placeholder="you@example.com" required>
          <p class="form-error">Please enter a valid email address</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" type="password" id="login-password" placeholder="Enter your password" required>
          <p class="form-error">Password is required</p>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-6)">
          <label style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-sm);color:var(--text-secondary);cursor:pointer">
            <input type="checkbox" style="accent-color:var(--primary-500)"> Remember me
          </label>
          <a href="#" style="font-size:var(--fs-sm);color:var(--primary-400)">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Login →</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up for free</a></p>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.getCurrentUser()) window.location.href = "dashboard.html";

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email");
      const password = document.getElementById("login-password");

      let valid = true;
      valid = UI.validateField(email, UI.validateEmail(email.value), "Please enter a valid email address") && valid;
      valid = UI.validateField(password, password.value.length >= 1, "Password is required") && valid;

      if (!valid) return false;

      const result = Auth.login(email.value, password.value);
      if (result.success) {
        UI.showToast("Login successful! Redirecting...", "success");
        setTimeout(() => window.location.href = "dashboard.html", 1000);
      } else {
        UI.showToast(result.message, "error");
      }
      return false;
    }
  </script>
</body>
</html>
